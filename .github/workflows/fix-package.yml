name: Fix Kotlin Package Import

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支'
        required: true
        type: string
        default: 'main'
      dry_run:
        description: 'Dry run（只探测不改文件）'
        required: false
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 环境准备（需要 gomobile 生成 AAR）
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done
          echo "SDKMANAGER=$SDKMGR" >> $GITHUB_ENV

      - name: Accept licenses + Install NDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$SDKMANAGER" --install "ndk;26.1.10909125" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile
        shell: bash
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ============================================================
      # 生成 AAR（只为探测包名）
      # ============================================================
      - name: Build AAR (for package detection)
        shell: bash
        working-directory: mobile
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go mod tidy
          gomobile init
          mkdir -p ../app/libs
          gomobile bind \
            -target=android \
            -androidapi 26 \
            -javapkg=com.n2n \
            -ldflags "-checklinkname=0" \
            -o ../app/libs/n2nclient.aar \
            .
          echo "✅ AAR 生成完成"

      # ============================================================
      # 探测 AAR 里真实包名
      # ============================================================
      - name: Detect actual package name in AAR
        id: detect
        shell: bash
        run: |
          AAR="app/libs/n2nclient.aar"

          if [ ! -f "$AAR" ]; then
            echo "::error::AAR 不存在"
            exit 1
          fi

          # 解压 classes.jar
          mkdir -p /tmp/aar
          cd /tmp/aar
          unzip -o "$GITHUB_WORKSPACE/$AAR" classes.jar > /dev/null
          ls -la classes.jar

          echo "--- classes.jar 里的 com/n2n/... 目录 ---"
          unzip -l classes.jar | grep -E "com/n2n/" | head -20

          # 找 Client.class 的路径
          PACKAGE_PATH=$(unzip -l classes.jar | grep -oE "com/n2n/[a-zA-Z0-9_/]+/Client\.class" | head -1)

          if [ -z "$PACKAGE_PATH" ]; then
            echo "::error::在 AAR 里找不到 Client.class"
            echo "--- 所有 com/n2n 路径 ---"
            unzip -l classes.jar | grep "com/n2n" | head -30
            exit 1
          fi

          echo "找到 Client.class 路径: $PACKAGE_PATH"

          # 提取包名: com/n2n/xxx/Client.class → com.n2n.xxx
          PACKAGE_DIR=$(dirname "$PACKAGE_PATH")
          PACKAGE_NAME=$(echo "$PACKAGE_DIR" | tr '/' '.')

          echo ""
          echo "=========================================="
          echo "  AAR 真实包名: $PACKAGE_NAME"
          echo "=========================================="

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      # ============================================================
      # 检查 Kotlin 里当前的 import
      # ============================================================
      - name: Check current Kotlin imports
        id: current
        shell: bash
        run: |
          echo "--- 当前 Kotlin 里的 com.n2n 相关 import ---"
          grep -rn "^import com\.n2n" app/src/main/java/com/n2n/android/ || echo "(无)"

          # 提取当前用的包名
          CURRENT_PKG=$(grep -rhoE "^import com\.n2n\.[a-z]+" app/src/main/java/com/n2n/android/ | head -1 | sed 's/^import //')

          if [ -z "$CURRENT_PKG" ]; then
            echo "::warning::未找到 import com.n2n.*"
            CURRENT_PKG="(none)"
          fi

          echo ""
          echo "当前包名: $CURRENT_PKG"
          echo "current_pkg=$CURRENT_PKG" >> $GITHUB_OUTPUT

      # ============================================================
      # 判断是否需要改
      # ============================================================
      - name: Decide action
        id: decide
        shell: bash
        run: |
          DETECTED="${{ steps.detect.outputs.package_name }}"
          CURRENT="${{ steps.current.outputs.current_pkg }}"

          echo "探测包名: $DETECTED"
          echo "当前包名: $CURRENT"

          if [ "$DETECTED" = "$CURRENT" ]; then
            echo "need_fix=false" >> $GITHUB_OUTPUT
            echo "::notice::包名已匹配，无需修改"
          else
            echo "need_fix=true" >> $GITHUB_OUTPUT
            echo "::notice::需要修改: $CURRENT → $DETECTED"
          fi

          # 也检查老包名 com.n2n.client 是否还在
          if grep -rq "com\.n2n\.client" app/src/main/java/com/n2n/android/ 2>/dev/null; then
            echo "has_old_client=true" >> $GITHUB_OUTPUT
            echo "::notice::检测到旧的 com.n2n.client 引用"
          else
            echo "has_old_client=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 修复 Kotlin import
      # ============================================================
      - name: Fix Kotlin imports
        if: steps.decide.outputs.need_fix == 'true' && !inputs.dry_run
        shell: bash
        env:
          TARGET_PKG: ${{ steps.detect.outputs.package_name }}
        run: |
          cd app/src/main/java/com/n2n/android

          echo "=== 修改前 ==="
          grep -n "^import com\.n2n" *.kt || echo "(无)"

          # 把所有 com.n2n.<任意> 改成 com.n2n.xxx（目标包名）
          for f in *.kt; do
            # 匹配 import com.n2n.anyword（不匹配 com.n2n.android 自身）
            sed -i -E "s|^import com\.n2n\.[a-z]+|import $TARGET_PKG|g" "$f"
          done

          echo ""
          echo "=== 修改后 ==="
          grep -n "^import com\.n2n" *.kt || echo "(无)"

      # ============================================================
      # 显示 diff
      # ============================================================
      - name: Show diff
        if: steps.decide.outputs.need_fix == 'true'
        shell: bash
        run: |
          echo "=== git diff ==="
          git diff --stat
          echo ""
          git diff app/src/main/java/com/n2n/android/ | head -100

      # ============================================================
      # 提交（dry_run 时跳过）
      # ============================================================
      - name: Commit and push
        if: steps.decide.outputs.need_fix == 'true' && !inputs.dry_run
        shell: bash
        env:
          OLD_PKG: ${{ steps.current.outputs.current_pkg }}
          NEW_PKG: ${{ steps.detect.outputs.package_name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/java/com/n2n/android/*.kt

          MSG="fix: Kotlin import 自动修正为 $NEW_PKG（匹配 AAR 真实包名） [skip ci]"
          git commit -m "$MSG"
          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      # ============================================================
      # Summary
      # ============================================================
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Fix Kotlin Package Import 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 探测结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- AAR 真实包名: \`${{ steps.detect.outputs.package_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 当前 Kotlin 包名: \`${{ steps.current.outputs.current_pkg }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 是否需要修改: \`${{ steps.decide.outputs.need_fix }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.decide.outputs.need_fix }}" = "true" ] && [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "### ✅ 已自动修改并推送" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "改为: \`${{ steps.detect.outputs.package_name }}\`" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.decide.outputs.need_fix }}" = "true" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### 🔍 Dry run：检测到需要修改，但未实际改动" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "应改为: \`${{ steps.detect.outputs.package_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "重新触发时不要勾 \`dry_run\` 即会自动修改。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ 包名已匹配，无需修改" >> $GITHUB_STEP_SUMMARY
          fi
