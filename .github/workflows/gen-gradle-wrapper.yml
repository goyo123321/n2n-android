name: Generate Gradle Wrapper

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支'
        required: true
        type: string
        default: 'main'
      gradle_version:
        description: 'Gradle 版本'
        required: true
        type: string
        default: '8.7'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle
        shell: bash
        run: |
          VERSION="${{ inputs.gradle_version }}"
          echo "下载 Gradle $VERSION..."
          curl -sSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-${VERSION}/bin" >> $GITHUB_PATH
          echo "✅ 下载完成"

      - name: Show Gradle version
        run: gradle --version

      - name: Generate Wrapper
        shell: bash
        env:
          VERSION: ${{ inputs.gradle_version }}
        run: |
          gradle wrapper --gradle-version "$VERSION"
          echo "--- 生成结果 ---"
          ls -la gradlew gradlew.bat gradle/wrapper/

      - name: Verify
        shell: bash
        run: |
          echo "=== 检查文件 ==="
          fail=0
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ -e "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || echo "?")
              echo "✅ $f (${size} bytes)"
            else
              echo "❌ 缺失: $f"
              fail=$((fail+1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "::error::生成后有 $fail 个文件缺失"
            exit 1
          fi

          # gradlew 必须可执行
          if [ -x gradlew ]; then
            echo "✅ gradlew 可执行"
          else
            echo "::warning::gradlew 不可执行，尝试修复"
            chmod +x gradlew
          fi

          # 检查 wrapper jar 是真的 jar（不是空文件）
          jar_size=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          if [ "$jar_size" -lt 10000 ]; then
            echo "::error::gradle-wrapper.jar 太小（${jar_size} bytes），可能损坏"
            exit 1
          fi
          echo "✅ gradle-wrapper.jar 大小正常"

      - name: Stage
        shell: bash
        run: |
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          echo "--- 暂存区 ---"
          git status --short

      - name: Check diff
        id: diff
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::文件已存在且无变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::检测到变化："
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.gradle_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 生成 Gradle Wrapper (Gradle ${VERSION}) [skip ci]"
          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Generate Gradle Wrapper 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Gradle 版本: \`${{ inputs.gradle_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 是否有变化: \`${{ steps.diff.outputs.changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ -e "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || echo "?")
              echo "- ✅ \`$f\` (${size} bytes)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ \`$f\` 缺失" >> $GITHUB_STEP_SUMMARY
            fi
          done
