name: Update go.sum

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '操作的目标分支'
        required: true
        type: string
        default: 'main'
      go_version:
        description: 'Go 版本'
        required: false
        type: string
        default: '1.21'
      commit_message:
        description: '提交信息（留空则用默认）'
        required: false
        type: string
        default: ''
      force_commit:
        description: '强制提交（即使没有变化）'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Show Go version
        run: go version

      - name: Before — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (before) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (before) ==="
          if [ -f go.sum ]; then
            echo "存在，行数："
            wc -l go.sum
            head -20 go.sum
          else
            echo "(go.sum 不存在，go mod tidy 将会生成)"
          fi

      - name: Run go mod tidy
        shell: bash
        working-directory: mobile
        run: |
          go mod tidy -v
          echo "go mod tidy 完成"
          if [ -f go.sum ]; then
            echo "✅ go.sum 存在，行数：$(wc -l < go.sum)"
          else
            echo "⚠️ go mod tidy 后 go.sum 仍不存在（可能 go.mod 无外部依赖）"
          fi

      - name: Run go mod verify
        shell: bash
        working-directory: mobile
        continue-on-error: true
        run: go mod verify

      - name: After — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (after) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (after) ==="
          if [ -f go.sum ]; then
            wc -l go.sum
            head -20 go.sum
          else
            echo "(go.sum 不存在)"
          fi

      - name: Stage go.mod / go.sum
        shell: bash
        run: |
          git add mobile/go.mod
          if [ -f mobile/go.sum ]; then
            git add -f mobile/go.sum
            echo "已 stage: mobile/go.mod, mobile/go.sum"
          else
            echo "已 stage: mobile/go.mod（go.sum 不存在，跳过）"
          fi
          echo ""
          echo "--- 暂存区状态 ---"
          git status --short

      - name: Check staged diff
        id: diff
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::mobile/go.mod 和 mobile/go.sum 无变化（暂存区为空）"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::检测到变化："
            git diff --cached --stat
            echo ""
            echo "--- go.mod diff ---"
            git diff --cached -- mobile/go.mod | head -40
            echo ""
            echo "--- go.sum diff (前 20 行) ---"
            git diff --cached -- mobile/go.sum | head -20
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        shell: bash
        env:
          CUSTOM_MSG: ${{ inputs.commit_message }}
          VERSION: ${{ inputs.go_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$CUSTOM_MSG" ]; then
            MSG="$CUSTOM_MSG"
          else
            MSG="chore: update mobile/go.sum (Go ${VERSION}) [skip ci]"
          fi

          if [ -f mobile/go.sum ]; then
            if git ls-files --error-unmatch mobile/go.sum >/dev/null 2>&1; then
              ACTION="更新"
            else
              ACTION="新增"
            fi
          else
            ACTION="跳过 go.sum"
          fi
          echo "::notice::操作: $ACTION"

          if git diff --cached --quiet; then
            echo "::warning::没有可提交的变化，force_commit 生效，创建空提交"
            git commit --allow-empty -m "$MSG"
          else
            git commit -m "$MSG"
          fi

          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Update go.sum 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Go 版本: \`${{ inputs.go_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 目标目录: \`mobile/\`" >> $GITHUB_STEP_SUMMARY
          echo "- 是否有变化: \`${{ steps.diff.outputs.changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 提交信息: \`${{ inputs.commit_message || '（默认）' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 强制提交: \`${{ inputs.force_commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 文件状态" >> $GITHUB_STEP_SUMMARY
          if [ -f mobile/go.sum ]; then
            echo "- ✅ \`mobile/go.sum\` 存在（$(wc -l < mobile/go.sum) 行）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ \`mobile/go.sum\` 不存在" >> $GITHUB_STEP_SUMMARY
          fi
