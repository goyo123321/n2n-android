name: Update go.sum

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '操作的目标分支'
        required: true
        type: string
        default: 'main'
      go_version:
        description: 'Go 版本（必须与 go.mod 一致）'
        required: false
        type: string
        default: '1.26'                    # ★ 改这里
      commit_message:
        description: '提交信息（留空则用默认）'
        required: false
        type: string
        default: ''
      force_commit:
        description: '强制提交（即使没有变化）'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Show Go version
        run: go version

      - name: Before — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (before) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (before) ==="
          if [ -f go.sum ]; then
            echo "行数：$(wc -l < go.sum)"
          else
            echo "(go.sum 不存在)"
          fi

      # ★ 只检查 tool 块是否存在，不重复添加
      - name: Ensure tool block exists
        shell: bash
        working-directory: mobile
        run: |
          if grep -q '^tool' go.mod; then
            echo "✅ tool 块已存在，跳过"
          else
            echo "tool 块不存在，添加..."
            go get -tool golang.org/x/mobile/cmd/gobind
            go get -tool golang.org/x/mobile/cmd/gomobile
          fi

      - name: Run go mod tidy
        shell: bash
        working-directory: mobile
        run: |
          go mod tidy -v

      - name: Verify mobile package compiles
        shell: bash
        working-directory: mobile
        run: |
          # ★ 真正重要的是能不能编译，加了这一步才有效
          echo "=== 检查 mobile 包编译 ==="
          if ! go build ./...; then
            echo "::error::mobile 包编译失败"
            exit 1
          fi
          echo "✅ mobile 包编译通过"

      - name: After — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (after) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (after) ==="
          if [ -f go.sum ]; then
            echo "行数：$(wc -l < go.sum)"
          fi

      - name: Stage go.mod / go.sum
        shell: bash
        run: |
          git add mobile/go.mod
          if [ -f mobile/go.sum ]; then
            git add -f mobile/go.sum
          fi
          git status --short

      - name: Check staged diff
        id: diff
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        shell: bash
        env:
          CUSTOM_MSG: ${{ inputs.commit_message }}
          VERSION: ${{ inputs.go_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$CUSTOM_MSG" ]; then
            MSG="$CUSTOM_MSG"
          else
            MSG="chore: update mobile/go.sum (Go ${VERSION}) [skip ci]"
          fi

          if git diff --cached --quiet; then
            git commit --allow-empty -m "$MSG"
          else
            git commit -m "$MSG"
          fi

          git push origin "$BRANCH"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Update go.sum 结果" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Go 版本: \`${{ inputs.go_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 是否有变化: \`${{ steps.diff.outputs.changed }}\`" >> $GITHUB_STEP_SUMMARY
