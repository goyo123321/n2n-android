name: Update go.sum

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '操作的目标分支'
        required: true
        type: string
        default: 'main'
      go_version:
        description: 'Go 版本（建议 1.24+，gomobile tool 依赖需要）'
        required: false
        type: string
        default: '1.26'
      commit_message:
        description: '提交信息（留空则用默认）'
        required: false
        type: string
        default: ''
      force_commit:
        description: '强制提交（即使没有变化）'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Show Go version
        run: go version

      - name: Before — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (before) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (before) ==="
          if [ -f go.sum ]; then
            echo "存在，行数："
            wc -l go.sum
          else
            echo "(go.sum 不存在)"
          fi

      # ★ 新增：添加 gomobile tool 依赖
      - name: Add gomobile tool dependencies
        shell: bash
        working-directory: mobile
        run: |
          echo "=== 添加 gomobile tool 依赖（Go 1.24+ 要求）==="
          go get -tool golang.org/x/mobile/cmd/gobind
          go get -tool golang.org/x/mobile/cmd/gomobile
          echo "✅ tool 依赖已添加"
          echo ""
          echo "--- go.mod after add tool ---"
          cat go.mod

      - name: Run go mod tidy
        shell: bash
        working-directory: mobile
        run: |
          go mod tidy -v
          echo "go mod tidy 完成"
          if [ -f go.sum ]; then
            echo "✅ go.sum 存在，行数：$(wc -l < go.sum)"
          else
            echo "⚠️ go.sum 不存在"
          fi

      - name: Run go mod verify
        shell: bash
        working-directory: mobile
        continue-on-error: true
        run: go mod verify

      - name: After — show go.mod / go.sum
        shell: bash
        working-directory: mobile
        run: |
          echo "=== mobile/go.mod (after) ==="
          cat go.mod
          echo ""
          echo "=== mobile/go.sum (after) ==="
          if [ -f go.sum ]; then
            wc -l go.sum
          else
            echo "(go.sum 不存在)"
          fi

      - name: Stage go.mod / go.sum
        shell: bash
        run: |
          git add mobile/go.mod
          if [ -f mobile/go.sum ]; then
            git add -f mobile/go.sum
            echo "已 stage: mobile/go.mod, mobile/go.sum"
          else
            echo "已 stage: mobile/go.mod"
          fi
          echo ""
          echo "--- 暂存区状态 ---"
          git status --short

      - name: Check staged diff
        id: diff
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::mobile/go.mod 和 mobile/go.sum 无变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::检测到变化："
            git diff --cached --stat
          fi

      - name: Configure git
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' || inputs.force_commit
        shell: bash
        env:
          CUSTOM_MSG: ${{ inputs.commit_message }}
          VERSION: ${{ inputs.go_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$CUSTOM_MSG" ]; then
            MSG="$CUSTOM_MSG"
          else
            MSG="chore: update mobile/go.sum + gomobile tool (Go ${VERSION}) [skip ci]"
          fi

          if git diff --cached --quiet; then
            echo "::warning::没有可提交的变化，force_commit 生效"
            git commit --allow-empty -m "$MSG"
          else
            git commit -m "$MSG"
          fi

          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Update go.sum 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Go 版本: \`${{ inputs.go_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 是否有变化: \`${{ steps.diff.outputs.changed }}\`" >> $GITHUB_STEP_SUMMARY
