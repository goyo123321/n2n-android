name: Debug All Steps

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    name: 逐步诊断全流程
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 环境准备
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done
          echo "SDKMANAGER=$SDKMGR" >> $GITHUB_ENV
          echo "✅ ANDROID_HOME=$ANDROID_HOME"
          echo "✅ sdkmanager=$SDKMGR"

      - name: Accept licenses + Install NDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$SDKMANAGER" --install "ndk;26.1.10909125" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "✅ NDK ready"

      - name: Install gomobile
        shell: bash
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ============================================================
      # Step 1 - gomobile bind
      # ============================================================
      - name: "Step 1: gomobile bind"
        id: step1
        shell: bash
        continue-on-error: true
        working-directory: mobile
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go mod tidy
          gomobile init

          mkdir -p ../app/libs
          set +e
          gomobile bind \
            -target=android \
            -androidapi 26 \
            -ldflags "-checklinkname=0" \
            -o ../app/libs/n2nclient.aar \
            . 2>&1 | tee /tmp/step1.log
          EXIT=$?
          set -e

          echo ""
          echo "=== Step 1 退出码: $EXIT ==="
          echo "step1_exit=$EXIT" >> $GITHUB_OUTPUT

          if [ -f ../app/libs/n2nclient.aar ]; then
            ls -la ../app/libs/
            echo "✅ AAR 生成"
          else
            echo "❌ AAR 未生成"
          fi

          exit $EXIT

      - name: "Step 1 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 1: gomobile bind" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step1.outputs.step1_exit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/libs/n2nclient.aar" ]; then
            SIZE=$(du -h app/libs/n2nclient.aar | cut -f1)
            echo "✅ AAR: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ AAR 未生成" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/step1.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### gomobile 错误" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error|Error|failed|cannot|invalid" /tmp/step1.log | head -30 >> $GITHUB_STEP_SUMMARY || echo "(无错误关键字)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ============================================================
      # Step 2 - Kotlin compile with real AAR
      # ============================================================
      - name: "Step 2: Kotlin compile"
        id: step2
        shell: bash
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon 2>&1 | tee /tmp/step2.log
          EXIT=${PIPESTATUS[0]}
          set -e

          echo "step2_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== Step 2 退出码: $EXIT ==="

      - name: "Step 2 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 2: Kotlin compile" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step2.outputs.step2_exit }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/step2.log ]; then
            ERRORS=$(grep -E "^e: file" /tmp/step2.log || true)
            if [ -n "$ERRORS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Kotlin 错误" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ============================================================
      # Step 3 - APK build
      # ============================================================
      - name: "Step 3: APK build"
        id: step3
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/step3.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "step3_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== Step 3 退出码: $EXIT ==="

      - name: "Step 3 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 3: APK build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step3.outputs.step3_exit }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK 未生成" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/step3.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 最后 30 行" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -30 /tmp/step3.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ============================================================
      # 上传所有日志
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/step1.log
            /tmp/step2.log
            /tmp/step3.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 最终汇总
      # ============================================================
      - name: Final Summary
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 退出码 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          E1="${{ steps.step1.outputs.step1_exit }}"
          E2="${{ steps.step2.outputs.step2_exit }}"
          E3="${{ steps.step3.outputs.step3_exit }}"

          R1=$([ "$E1" = "0" ] && echo "✅" || echo "❌")
          R2=$([ "$E2" = "0" ] && echo "✅" || echo "❌")
          R3=$([ "$E3" = "0" ] && echo "✅" || echo "❌")

          echo "| Step 1: gomobile bind | $E1 | $R1 |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 2: Kotlin compile | $E2 | $R2 |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 3: APK build | $E3 | $R3 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$E1" = "0" ] && [ "$E2" = "0" ] && [ "$E3" = "0" ]; then
            echo "## 🎉 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ 有步骤失败，见各步 Summary" >> $GITHUB_STEP_SUMMARY
          fi
