name: Debug All Steps

on:
  workflow_dispatch:
    inputs:
      gvisor_version:
        description: 'gvisor 版本（修复 Go 1.26 WaitReason* redeclared）'
        required: false
        type: string
        default: 'v0.0.0-20260617234043-9307ff8f53c4'
      x_mobile_version:
        description: 'golang.org/x/mobile 版本'
        required: false
        type: string
        default: 'v0.0.0-20260908204917-8b95e45f8d3e'
      go_version:
        description: 'Go 版本'
        required: false
        type: string
        default: '1.26'
      ndk_version:
        description: 'Android NDK 版本'
        required: false
        type: string
        default: '26.1.10909125'
      skip_ndk_install:
        description: '跳过 NDK 安装（CI 已预装时加速）'
        required: false
        type: boolean
        default: false
      run_step2:
        description: '运行 Step 2 (Kotlin 编译)'
        required: false
        type: boolean
        default: true
      run_step3:
        description: '运行 Step 3 (APK 构建)'
        required: false
        type: boolean
        default: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=mod

jobs:
  debug:
    runs-on: ubuntu-latest
    name: 逐步诊断全流程
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 环境准备
      # ============================================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done
          echo "SDKMANAGER=$SDKMGR" >> $GITHUB_ENV
          echo "✅ ANDROID_HOME=$ANDROID_HOME"
          echo "✅ sdkmanager=$SDKMGR"

      - name: Accept licenses + Install NDK
        if: ${{ !inputs.skip_ndk_install }}
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/${{ inputs.ndk_version }}" ]; then
            yes | "$SDKMANAGER" --install "ndk;${{ inputs.ndk_version }}" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ inputs.ndk_version }}" >> $GITHUB_ENV
          echo "✅ NDK ready"

      - name: Set NDK env (跳过安装时用)
        if: ${{ inputs.skip_ndk_install }}
        shell: bash
        run: |
          if [ -d "$ANDROID_HOME/ndk/${{ inputs.ndk_version }}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ inputs.ndk_version }}" >> $GITHUB_ENV
            echo "✅ NDK 已存在：$ANDROID_HOME/ndk/${{ inputs.ndk_version }}"
          else
            echo "::error::NDK ${{ inputs.ndk_version }} 不存在，且勾选了跳过安装"
            ls "$ANDROID_HOME/ndk/" || true
            exit 1
          fi

      # ============================================================
      # Step 0: 修正 go.mod
      # ============================================================
      - name: "Step 0: 修正 go.mod"
        id: step0
        shell: bash
        working-directory: mobile
        run: |
          echo "=== Before ==="
          grep -E "gvisor|x/mobile|^go " go.mod || true

          go mod edit -require="gvisor.dev/gvisor@${{ inputs.gvisor_version }}"
          go mod edit -require="golang.org/x/mobile@${{ inputs.x_mobile_version }}"

          echo ""
          echo "=== After ==="
          grep -E "gvisor|x/mobile|^go " go.mod || true
          echo "step0_exit=0" >> $GITHUB_OUTPUT

      - name: "Step 0b: go mod tidy"
        id: step0b
        shell: bash
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          go mod tidy -v 2>&1 | tee /tmp/step0b.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "step0b_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== tidy 退出码: $EXIT ==="

      # ============================================================
      # ★ 分水岭：go build ./...（不涉及 gomobile）
      # ============================================================
      - name: "Step 0c: go build ./..."
        id: step0c
        shell: bash
        continue-on-error: true
        working-directory: mobile
        run: |
          set +e
          go build ./... 2>&1 | tee /tmp/step0c.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "step0c_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== go build 退出码: $EXIT ==="

          if [ "$EXIT" != "0" ]; then
            echo "❌ go build 失败，gomobile bind 必然失败。"
            echo "--- 错误详情 ---"
            cat /tmp/step0c.log
            exit $EXIT
          fi
          echo "✅ go build 通过"

      # ============================================================
      # gomobile 安装（固定版本）
      # ============================================================
      - name: Install gomobile（固定版本）
        if: ${{ steps.step0c.outputs.step0c_exit == '0' }}
        shell: bash
        run: |
          GOBIN="$(go env GOPATH)/bin"
          go install "golang.org/x/mobile/cmd/gomobile@${{ inputs.x_mobile_version }}"
          go install "golang.org/x/mobile/cmd/gobind@${{ inputs.x_mobile_version }}"
          echo "$GOBIN" >> $GITHUB_PATH
          echo "✅ gomobile 安装完成："
          ls -la "$GOBIN" | grep -E "gomobile|gobind" || true

      # ============================================================
      # Step 1: gomobile bind
      # ============================================================
      - name: "Step 1: gomobile bind"
        id: step1
        if: ${{ steps.step0c.outputs.step0c_exit == '0' }}
        shell: bash
        continue-on-error: true
        working-directory: mobile
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "GOPATH=$(go env GOPATH)"
          echo "GOTOOLCHAIN=$GOTOOLCHAIN"

          gomobile init

          echo "--- mobile.go 第一行 ---"
          head -1 mobile.go

          mkdir -p ../app/libs
          set +e
          gomobile bind \
            -target=android \
            -androidapi 26 \
            -javapkg=com.n2n \
            -ldflags=-checklinkname=0 \
            -o ../app/libs/n2nclient.aar \
            . 2>&1 | tee /tmp/step1.log
          EXIT=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "=== Step 1 退出码: $EXIT ==="
          echo "step1_exit=$EXIT" >> $GITHUB_OUTPUT

          if [ -f ../app/libs/n2nclient.aar ]; then
            ls -la ../app/libs/
            echo ""
            echo "--- AAR 里的包名 ---"
            unzip -l ../app/libs/n2nclient.aar | grep -E "com/n2n" | head -10 || true
            echo "✅ AAR 生成"
          else
            echo "❌ AAR 未生成"
          fi

          exit $EXIT

      - name: "Step 1 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 1: gomobile bind" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step1.outputs.step1_exit }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/libs/n2nclient.aar" ]; then
            SIZE=$(du -h app/libs/n2nclient.aar | cut -f1)
            echo "✅ AAR: $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/step1.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### gomobile 错误" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error|Error|failed|cannot|invalid|undefined|redeclared" /tmp/step1.log | head -30 >> $GITHUB_STEP_SUMMARY || echo "(无错误关键字)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ============================================================
      # Step 2: Kotlin compile
      # ============================================================
      - name: "Step 2: Kotlin compile"
        id: step2
        if: ${{ inputs.run_step2 }}
        shell: bash
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon 2>&1 | tee /tmp/step2.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "step2_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== Step 2 退出码: $EXIT ==="

      - name: "Step 2 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 2: Kotlin compile" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step2.outputs.step2_exit }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/step2.log ]; then
            ERRORS=$(grep -E "^e: file" /tmp/step2.log || true)
            if [ -n "$ERRORS" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Kotlin 错误" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ 无 Kotlin 错误" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ============================================================
      # Step 3: APK build
      # ============================================================
      - name: "Step 3: APK build"
        id: step3
        if: ${{ inputs.run_step3 }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/step3.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "step3_exit=$EXIT" >> $GITHUB_OUTPUT
          echo "=== Step 3 退出码: $EXIT ==="

      - name: "Step 3 summary"
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Step 3: APK build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 退出码: \`${{ steps.step3.outputs.step3_exit }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK 未生成" >> $GITHUB_STEP_SUMMARY
            if [ -f /tmp/step3.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 最后 30 行" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -30 /tmp/step3.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # ============================================================
      # 上传日志
      # ============================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/step0b.log
            /tmp/step0c.log
            /tmp/step1.log
            /tmp/step2.log
            /tmp/step3.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 上传 AAR / APK
      # ============================================================
      - name: Upload AAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2nclient-aar
          path: app/libs/n2nclient.aar
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2n-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 最终汇总
      # ============================================================
      - name: Final Summary
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 输入参数" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 参数 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| gvisor | \`${{ inputs.gvisor_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| x/mobile | \`${{ inputs.x_mobile_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Go | \`${{ inputs.go_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | \`${{ inputs.ndk_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 跳过 NDK 安装 | \`${{ inputs.skip_ndk_install }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 步骤汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 步骤 | 退出码 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          E0b="${{ steps.step0b.outputs.step0b_exit }}"
          E0c="${{ steps.step0c.outputs.step0c_exit }}"
          E1="${{ steps.step1.outputs.step1_exit }}"
          E2="${{ steps.step2.outputs.step2_exit }}"
          E3="${{ steps.step3.outputs.step3_exit }}"

          R() { [ "$1" = "0" ] && echo "✅" || ([ -z "$1" ] && echo "⏭️" || echo "❌"); }

          echo "| Step 0b: go mod tidy | $E0b | $(R $E0b) |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 0c: go build ./... | $E0c | $(R $E0c) |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 1: gomobile bind | $E1 | $(R $E1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 2: Kotlin compile | $E2 | $(R $E2) |" >> $GITHUB_STEP_SUMMARY
          echo "| Step 3: APK build | $E3 | $(R $E3) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$E0b" = "0" ] && [ "$E0c" = "0" ] && [ "$E1" = "0" ] && { [ "$E2" = "0" ] || [ -z "$E2" ]; } && { [ "$E3" = "0" ] || [ -z "$E3" ]; }; then
            echo "## 🎉 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ 有步骤失败，见各步 Summary" >> $GITHUB_STEP_SUMMARY
          fi
