name: Download Geo Data

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新下载（即使文件已存在）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-24.04
    name: Download geoip_cn + geosite_cn

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare directory
        run: |
          mkdir -p mobile/internal/data
          ls -la mobile/internal/data/ || true

      - name: Check existing files
        id: check
        run: |
          GEOIP_EXISTS=false
          GEOSITE_EXISTS=false

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制重新下载"
          else
            if [ -s mobile/internal/data/geoip_cn.txt ]; then
              GEOIP_EXISTS=true
              echo "geoip_cn.txt 已存在 ($(wc -l < mobile/internal/data/geoip_cn.txt) 行)"
            fi
            if [ -s mobile/internal/data/geosite_cn.txt ]; then
              GEOSITE_EXISTS=true
              echo "geosite_cn.txt 已存在 ($(wc -l < mobile/internal/data/geosite_cn.txt) 行)"
            fi
          fi

          echo "geoip_exists=$GEOIP_EXISTS" >> $GITHUB_OUTPUT
          echo "geosite_exists=$GEOSITE_EXISTS" >> $GITHUB_OUTPUT

      - name: Download geoip_cn.txt
        if: steps.check.outputs.geoip_exists != 'true'
        run: |
          echo "下载国内 IP 段..."

          if curl -fsSL --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt" \
              -o /tmp/geoip_cn.txt; then
            echo "✅ 主源成功"
          else
            echo "主源失败，改用 jsdelivr CDN..."
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://cdn.jsdelivr.net/gh/17mon/china_ip_list@master/china_ip_list.txt" \
              -o /tmp/geoip_cn.txt
          fi

          if [ ! -s /tmp/geoip_cn.txt ]; then
            echo "❌ 下载失败或文件为空"
            exit 1
          fi

          LINES=$(wc -l < /tmp/geoip_cn.txt)
          echo "✅ 下载完成: $LINES 行"
          head -5 /tmp/geoip_cn.txt

          if ! head -1 /tmp/geoip_cn.txt | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+'; then
            echo "❌ 文件格式异常（第一行不是 CIDR）"
            head -20 /tmp/geoip_cn.txt
            exit 1
          fi

          cp /tmp/geoip_cn.txt mobile/internal/data/geoip_cn.txt

      - name: Download geosite_cn.txt (递归展开 include)
        if: steps.check.outputs.geosite_exists != 'true'
        run: |
          echo "下载并递归展开 v2fly/domain-list-community/data/cn..."

          cat > /tmp/expand_cn.py <<'PYEOF'
import sys
import urllib.request
import urllib.error

BASE_RAW = "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/"
BASE_CDN = "https://cdn.jsdelivr.net/gh/v2fly/domain-list-community@master/data/"

visited = set()
lines = []

def fetch(name):
    for base in (BASE_RAW, BASE_CDN):
        try:
            url = base + name
            req = urllib.request.Request(url, headers={"User-Agent": "curl/8.0"})
            with urllib.request.urlopen(req, timeout=15) as r:
                return r.read().decode("utf-8")
        except Exception as e:
            print(f"  {base}{name} 失败: {e}", file=sys.stderr)
            continue
    return None

def expand(name, depth=0):
    if name in visited:
        return
    visited.add(name)

    content = fetch(name)
    if content is None:
        print(f"[跳过] 无法下载: {name}", file=sys.stderr)
        return

    for raw in content.splitlines():
        line = raw.strip()
        if not line or line.startswith("#"):
            continue

        if line.startswith("include:"):
            sub = line[len("include:"):].strip()
            print(f"{'  ' * depth}-> include:{sub}", file=sys.stderr)
            expand(sub, depth + 1)
        else:
            lines.append(line)

expand("cn")

uniq = sorted(set(lines))

out_path = "/tmp/geosite_cn.txt"
with open(out_path, "w") as f:
    for l in uniq:
        f.write(l + "\n")

print(f"✅ 展开完成: {len(uniq)} 条（去重前 {len(lines)} 条）", file=sys.stderr)
print(f"✅ 访问文件数: {len(visited)}", file=sys.stderr)
PYEOF

          python3 /tmp/expand_cn.py

          if [ ! -s /tmp/geosite_cn.txt ]; then
            echo "❌ 展开失败或文件为空"
            exit 1
          fi

          LINES=$(wc -l < /tmp/geosite_cn.txt)
          echo "✅ geosite_cn.txt: $LINES 行"
          echo "--- 前 5 行 ---"
          head -5 /tmp/geosite_cn.txt
          echo "--- 后 5 行 ---"
          tail -5 /tmp/geosite_cn.txt

          if [ "$LINES" -lt 1000 ]; then
            echo "❌ 行数太少（$LINES），可能展开不完整"
            exit 1
          fi

          cp /tmp/geosite_cn.txt mobile/internal/data/geosite_cn.txt

      - name: Show final status
        run: |
          echo "========== 数据文件状态 =========="
          ls -lh mobile/internal/data/
          echo ""
          echo "geoip_cn.txt: $(wc -l < mobile/internal/data/geoip_cn.txt) 行"
          echo "geosite_cn.txt: $(wc -l < mobile/internal/data/geosite_cn.txt) 行"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mobile/internal/data/geoip_cn.txt mobile/internal/data/geosite_cn.txt

          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi

          GEOIP_LINES=$(wc -l < mobile/internal/data/geoip_cn.txt)
          GEOSITE_LINES=$(wc -l < mobile/internal/data/geosite_cn.txt)

          git commit -m "chore: 更新 geo 数据文件

          - geoip_cn.txt: $GEOIP_LINES 行 (17mon/china_ip_list)
          - geosite_cn.txt: $GEOSITE_LINES 行 (v2fly/domain-list-community 递归展开)

          由 GitHub Actions 自动下载"

          git push
          echo "✅ 已提交并推送"
