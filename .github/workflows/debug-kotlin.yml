name: Debug Kotlin Compile

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    name: 只编译 Kotlin，输出详细错误
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 创建一个"假的"AAR，满足 app 依赖，但不参与 gomobile 编译
      # 里面包含 Kotlin 能识别的最小 stub 类
      # ============================================================
      - name: Create stub AAR
        shell: bash
        run: |
          mkdir -p /tmp/stub-aar/src/com/n2n/client
          mkdir -p /tmp/stub-aar/classes

          # ---- Stub Kotlin 文件，匹配 gomobile 生成的 API ----
          cat > /tmp/stub-aar/src/com/n2n/client/Stub.kt <<'EOF'
          package com.n2n.client

          class Config {
              fun setSignalingURL(v: String) {}
              fun setRoomID(v: String) {}
              fun setClientID(v: String) {}
              fun setNodeName(v: String) {}
              fun setConnectToken(v: String) {}
              fun setShareDir(v: String) {}
          }

          abstract class ProgressListener {
              open fun onUploadStart(filename: String, totalBytes: Long) {}
              open fun onUploadProgress(filename: String, received: Long, totalBytes: Long) {}
              open fun onUploadComplete(filename: String, received: Long, success: Boolean) {}
              open fun onUploadError(filename: String, message: String) {}
          }

          class Client {
              fun setTunFD(fd: Long) {}
              fun setProgressListener(l: ProgressListener) {}
              fun start(cfg: Config): String = ""
              fun stop() {}
              val status: String get() = ""
              val virtualIP: String get() = ""
              val clientID: String get() = ""
              val peersJSON: String get() = "[]"
          }
          EOF

          # ---- 编译 Stub 为 class ----
          javac -version

          # 找 kotlin 编译器（Android Gradle 会下载）
          # 简化方案：用 Gradle 自带的 Kotlin 编译——不行，这里用 javac 不行
          # 改个思路：让 Gradle 直接编译我们的 stub

          echo "改用 Gradle 生成 stub aar"

      # 更简单：直接删掉 AAR 依赖，改用 sourceSet 注入一个 stub 类
      - name: Create stub source
        shell: bash
        run: |
          mkdir -p app/src/stub/java/com/n2n/client
          cat > app/src/stub/java/com/n2n/client/Stub.kt <<'EOF'
          package com.n2n.client

          class Config {
              fun setSignalingURL(v: String) {}
              fun setRoomID(v: String) {}
              fun setClientID(v: String) {}
              fun setNodeName(v: String) {}
              fun setConnectToken(v: String) {}
              fun setShareDir(v: String) {}
          }

          abstract class ProgressListener {
              open fun onUploadStart(filename: String, totalBytes: Long) {}
              open fun onUploadProgress(filename: String, received: Long, totalBytes: Long) {}
              open fun onUploadComplete(filename: String, received: Long, success: Boolean) {}
              open fun onUploadError(filename: String, message: String) {}
          }

          class Client {
              fun setTunFD(fd: Long) {}
              fun setProgressListener(l: ProgressListener) {}
              fun start(cfg: Config): String = ""
              fun stop() {}
              val status: String get() = ""
              val virtualIP: String get() = ""
              val clientID: String get() = ""
              val peersJSON: String get() = "[]"
          }
          EOF

      - name: Patch build.gradle.kts for stub
        shell: bash
        run: |
          # 备份原文件
          cp app/build.gradle.kts app/build.gradle.kts.bak

          # 注释掉 AAR 依赖
          sed -i 's|implementation(files("libs/n2nclient.aar"))|// implementation(files("libs/n2nclient.aar"))|' app/build.gradle.kts

          # 加 stub sourceSet
          python3 <<'PYEOF'
          import re
          p = "app/build.gradle.kts"
          s = open(p).read()
          # 在 android { 块里加 sourceSets
          if "sourceSets" not in s:
              s = s.replace(
                  "android {",
                  "android {\n    sourceSets {\n        getByName(\"main\") {\n            java.srcDir(\"src/stub/java\")\n        }\n    }",
                  1
              )
          open(p, "w").write(s)
          PYEOF

          echo "--- 修改后的 app/build.gradle.kts 前 60 行 ---"
          head -60 app/build.gradle.kts

      # ============================================================
      # 只跑 Kotlin 编译，捕获所有错误
      # ============================================================
      - name: Run compileDebugKotlin
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee /tmp/kotlin.log
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT

          echo ""
          echo "================ 所有错误行 ================"
          grep -E "^e: file|error:" /tmp/kotlin.log || echo "(无 e:/error: 匹配)"
          echo "============================================="

          echo ""
          echo "================ 所有 Kotlin 相关 ================"
          grep -iE "kotlin|unresolved|expected|type mismatch" /tmp/kotlin.log | head -50 || true
          echo "=================================================="

      # ============================================================
      # 把错误提取到 summary
      # ============================================================
      - name: Extract errors to summary
        if: always()
        shell: bash
        run: |
          echo "## Kotlin 编译错误详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f /tmp/kotlin.log ]; then
            echo "❌ 未生成日志" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # 提取所有 e: 行
          ERRORS=$(grep -E "^e: file" /tmp/kotlin.log || true)
          if [ -z "$ERRORS" ]; then
            echo "### ✅ 没有 e: file 错误" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "可能编译通过了，或错误格式不同。完整日志见下方附件。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 错误列表" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # 按文件分组
            echo "### 按文件分组" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS" | sed -E 's|.*/app/src/main/java/com/n2n/android/([^:]+):.*|\1|' | sort -u | while read f; do
              echo "#### $f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$ERRORS" | grep "/$f:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 完整日志" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "见下方 artifact 中的 \`kotlin.log\`" >> $GITHUB_STEP_SUMMARY

      # ============================================================
      # 上传完整日志
      # ============================================================
      - name: Upload kotlin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-log
          path: /tmp/kotlin.log
          retention-days: 7
          if-no-files-found: warn

      # ============================================================
      # 汇总
      # ============================================================
      - name: Final Summary
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.compile.outputs.exit_code }}" = "0" ]; then
            echo "## ✅ Kotlin 编译通过" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "说明原问题不在 Kotlin 代码本身，可能是 gomobile 生成的 API 命名不一致导致的。" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Kotlin 编译失败" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "退出码: \`${{ steps.compile.outputs.exit_code }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**把上面的错误列表贴给我，我直接给修复。**" >> $GITHUB_STEP_SUMMARY
          fi
