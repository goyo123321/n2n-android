name: Fix Progress Listener

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支'
        required: true
        type: string
        default: 'main'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 1. 重写 mobile/mobile.go（删除 ProgressListener）
      # ============================================================
      - name: Rewrite mobile/mobile.go
        shell: bash
        run: |
          cat > mobile/mobile.go <<'GOEOF'
// Package mobile 是 gomobile 的桥接层。
package mobile

import (
	"log"
	"sync"
	"time"

	"github.com/goyo123321a/n2n-android/mobile/internal"
)

type Config struct {
	SignalingURL string
	RoomID       string
	ClientID     string
	NodeName     string
	ConnectToken string
	ShareDir     string
}

type Client struct {
	mu        sync.Mutex
	tunFd     int
	running   bool
	virtualIP string
	clientID  string
	edge      *internal.Edge
}

func NewClient() *Client {
	return &Client{}
}

func (c *Client) SetTunFD(fd int) {
	c.mu.Lock()
	defer c.mu.Unlock()
	c.tunFd = fd
}

func (c *Client) Start(cfg *Config) string {
	c.mu.Lock()
	if c.running {
		c.mu.Unlock()
		return "already running"
	}
	if c.tunFd <= 0 {
		c.mu.Unlock()
		return "tun fd not set"
	}
	tunFd := c.tunFd
	c.mu.Unlock()

	icfg := &internal.Config{
		SignalingURL: cfg.SignalingURL,
		RoomID:       cfg.RoomID,
		ClientID:     cfg.ClientID,
		NodeName:     cfg.NodeName,
		ConnectToken: cfg.ConnectToken,
		ShareDir:     cfg.ShareDir,
	}

	edge, err := internal.Start(icfg, tunFd)
	if err != nil {
		return err.Error()
	}

	c.mu.Lock()
	c.edge = edge
	c.running = true
	if cfg.ClientID != "" {
		c.clientID = cfg.ClientID
	} else {
		c.clientID = edge.GetClientID()
	}
	c.mu.Unlock()

	go func() {
		ticker := time.NewTicker(time.Second)
		defer ticker.Stop()
		for {
			c.mu.Lock()
			running := c.running
			edgeRef := c.edge
			c.mu.Unlock()
			if !running || edgeRef == nil {
				return
			}
			if vip := edgeRef.GetVirtualIP(); vip != "" {
				c.mu.Lock()
				c.virtualIP = vip
				c.mu.Unlock()
			}
			select {
			case <-edgeRef.Done():
				return
			case <-ticker.C:
			}
		}
	}()

	log.Printf("[mobile] started, room=%s", cfg.RoomID)
	return ""
}

func (c *Client) Stop() {
	c.mu.Lock()
	edge := c.edge
	c.edge = nil
	c.running = false
	c.virtualIP = ""
	c.mu.Unlock()

	if edge != nil {
		edge.Stop()
	}
	log.Printf("[mobile] stopped")
}

func (c *Client) GetStatus() string {
	c.mu.Lock()
	defer c.mu.Unlock()
	if !c.running {
		return "stopped"
	}
	if c.virtualIP == "" {
		return "starting"
	}
	return "running"
}

func (c *Client) GetVirtualIP() string {
	c.mu.Lock()
	defer c.mu.Unlock()
	return c.virtualIP
}

func (c *Client) GetClientID() string {
	c.mu.Lock()
	defer c.mu.Unlock()
	return c.clientID
}

func (c *Client) GetPeersJSON() string {
	c.mu.Lock()
	edge := c.edge
	c.mu.Unlock()
	if edge == nil {
		return "[]"
	}
	return edge.GetPeersJSON()
}
GOEOF
          echo "✅ mobile/mobile.go 已重写"

      # ============================================================
      # 2. 重写 internal/edge.go（删除 SetProgressListener 方法）
      # ============================================================
      - name: Strip SetProgressListener from edge.go
        shell: bash
        run: |
          # 删除 SetProgressListener 方法（从注释行到结束大括号）
          python3 <<'PYEOF'
import re

path = "mobile/internal/edge.go"
with open(path) as f:
    content = f.read()

# 删除 SetProgressListener 方法
pattern = r'\n//\s*SetProgressListener[^\n]*\n(?:func \(e \*Edge\) SetProgressListener\([^)]*\) \{[^}]*\}\n)'
content = re.sub(pattern, '\n', content)

# 如果还残留 progress 字段引用，只删除 SetProgressListener 那段
# 更保守的方式：手动找 `func (e *Edge) SetProgressListener` 并删除到匹配的 }
lines = content.split('\n')
out = []
i = 0
while i < len(lines):
    line = lines[i]
    if 'func (e *Edge) SetProgressListener' in line:
        # 跳过直到找到单独的 } 结束
        depth = 0
        while i < len(lines):
            depth += lines[i].count('{') - lines[i].count('}')
            i += 1
            if depth <= 0 and '}' in lines[i-1]:
                break
        # 也跳过前面的注释行
        while out and out[-1].strip().startswith('//'):
            out.pop()
        continue
    out.append(line)
    i += 1

content = '\n'.join(out)

with open(path, 'w') as f:
    f.write(content)

print("✅ edge.go 已处理")
PYEOF

          # 验证
          if grep -q "SetProgressListener" mobile/internal/edge.go; then
            echo "⚠️ 仍有 SetProgressListener 引用："
            grep -n "SetProgressListener" mobile/internal/edge.go
          else
            echo "✅ SetProgressListener 已删除"
          fi

      # ============================================================
      # 3. 重写 N2nController.kt
      # ============================================================
      - name: Rewrite N2nController.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/n2n/android/N2nController.kt <<'KTEOF'
package com.n2n.android

import com.n2n.mobile.Client
import com.n2n.mobile.Config
import java.util.concurrent.atomic.AtomicBoolean

object N2nController {

    private var client: Client? = null
    private val running = AtomicBoolean(false)

    fun isRunning(): Boolean = running.get()

    fun start(tunFd: Int, config: Config): String {
        if (running.get()) return "already running"

        val c = Client()
        c.setTunFD(tunFd.toLong())
        val err = c.start(config)
        if (err.isNotEmpty()) {
            return "start failed: $err"
        }
        client = c
        running.set(true)
        return ""
    }

    fun stop() {
        client?.stop()
        client = null
        running.set(false)
    }

    fun getStatus(): String = client?.status ?: "not running"
    fun getVirtualIP(): String = client?.virtualIP ?: ""
    fun getClientID(): String = client?.clientID ?: ""
    fun getPeersJSON(): String = client?.peersJSON ?: "[]"
}
KTEOF
          echo "✅ N2nController.kt 已重写"

      # ============================================================
      # 4. 重写 UploadProgressListener.kt（改成空类）
      # ============================================================
      - name: Rewrite UploadProgressListener.kt
        shell: bash
        run: |
          cat > app/src/main/java/com/n2n/android/UploadProgressListener.kt <<'KTEOF'
package com.n2n.android

import android.content.Context

/**
 * 上传进度监听（临时占位）
 *
 * gomobile 不支持导出 Go interface，暂时保留空类。
 * 后续方案：通过 Client.GetUploadProgressJSON() 轮询实现。
 */
class UploadProgressListener(private val ctx: Context) {
    // 暂时什么都不做
}
KTEOF
          echo "✅ UploadProgressListener.kt 已重写"

      # ============================================================
      # 5. 删除 N2nVpnService.kt 里的 setProgressListener 调用
      # ============================================================
      - name: Strip setProgressListener from N2nVpnService.kt
        shell: bash
        run: |
          sed -i '/N2nController.setProgressListener/d' \
            app/src/main/java/com/n2n/android/N2nVpnService.kt
          echo "✅ N2nVpnService.kt 已处理"

      # ============================================================
      # 6. 删除 MainActivity.kt 里的 setProgressListener 调用
      # ============================================================
      - name: Strip setProgressListener from MainActivity.kt
        shell: bash
        run: |
          sed -i '/N2nController.setProgressListener/d' \
            app/src/main/java/com/n2n/android/MainActivity.kt
          echo "✅ MainActivity.kt 已处理"

      # ============================================================
      # 7. 验证无残留
      # ============================================================
      - name: Verify no ProgressListener references
        shell: bash
        run: |
          echo "=== 检查残留引用 ==="
          set +e
          RESIDUAL=$(grep -rn "setProgressListener\|ProgressListener" \
            mobile/mobile.go \
            mobile/internal/edge.go \
            app/src/main/java/com/n2n/android/N2nController.kt \
            app/src/main/java/com/n2n/android/N2nVpnService.kt \
            app/src/main/java/com/n2n/android/MainActivity.kt \
            2>/dev/null)

          # UploadProgressListener.kt 自身是允许的
          if [ -n "$RESIDUAL" ]; then
            echo "⚠️ 残留引用："
            echo "$RESIDUAL"
          else
            echo "✅ 无残留引用"
          fi

          echo ""
          echo "=== 检查 mobile.go package 名 ==="
          head -3 mobile/mobile.go | grep "^package"

      # ============================================================
      # 8. 显示 diff
      # ============================================================
      - name: Show diff
        shell: bash
        run: |
          echo "=== git diff 摘要 ==="
          git diff --stat
          echo ""
          echo "=== 关键文件 diff（前 60 行）==="
          git diff mobile/mobile.go app/src/main/java/com/n2n/android/N2nController.kt | head -60

      # ============================================================
      # 9. 提交
      # ============================================================
      - name: Commit and push
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mobile/mobile.go \
                  mobile/internal/edge.go \
                  app/src/main/java/com/n2n/android/N2nController.kt \
                  app/src/main/java/com/n2n/android/UploadProgressListener.kt \
                  app/src/main/java/com/n2n/android/N2nVpnService.kt \
                  app/src/main/java/com/n2n/android/MainActivity.kt

          if git diff --cached --quiet; then
            echo "::notice::无变化"
            exit 0
          fi

          git commit -m "fix: 移除 ProgressListener（gomobile 不支持导出 Go interface） [skip ci]"
          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      # ============================================================
      # 10. Summary
      # ============================================================
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Fix Progress Listener 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Job 状态: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 修改的文件" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`mobile/mobile.go\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`mobile/internal/edge.go\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/src/main/java/com/n2n/android/N2nController.kt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/src/main/java/com/n2n/android/UploadProgressListener.kt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/src/main/java/com/n2n/android/N2nVpnService.kt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/src/main/java/com/n2n/android/MainActivity.kt\`" >> $GITHUB_STEP_SUMMARY
