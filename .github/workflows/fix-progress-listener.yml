name: Fix Progress Listener

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目标分支'
        required: true
        type: string
        default: 'main'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fix script
        shell: bash
        run: bash scripts/fix-progress-listener.sh

      - name: Show diff
        shell: bash
        run: |
          git diff --stat

      - name: Commit and push
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mobile/mobile.go \
                  mobile/internal/edge.go \
                  app/src/main/java/com/n2n/android/N2nController.kt \
                  app/src/main/java/com/n2n/android/UploadProgressListener.kt \
                  app/src/main/java/com/n2n/android/N2nVpnService.kt \
                  app/src/main/java/com/n2n/android/MainActivity.kt

          if git diff --cached --quiet; then
            echo "::notice::无变化"
            exit 0
          fi

          git commit -m "fix: 移除 ProgressListener（gomobile 不支持导出 Go interface） [skip ci]"
          git push origin "$BRANCH"
          echo "✅ 已推送到 $BRANCH"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Fix Progress Listener 结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ inputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Job 状态: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
