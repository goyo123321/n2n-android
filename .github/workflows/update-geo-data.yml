name: Update GeoIP/GeoSite Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Download Xray geo data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create data directory
        run: mkdir -p mobile/internal/data

      - name: Download geoip_cn.txt
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt" \
            -o mobile/internal/data/geoip_cn.txt
          LINES=$(wc -l < mobile/internal/data/geoip_cn.txt)
          echo "geoip_cn.txt 行数: $LINES"
          echo "geoip_cn.txt 大小: $(du -h mobile/internal/data/geoip_cn.txt | cut -f1)"
          [ "$LINES" -ge 1000 ] || { echo "geoip_cn.txt 行数太少"; exit 1; }

      - name: Download geosite_cn.txt
        run: |
          OUTPUT="mobile/internal/data/geosite_cn.txt"

          URLS=(
            "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite-cn.txt"
            "https://raw.githubusercontent.com/v2fly/domain-list-community/release/cn"
            "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/cn"
          )

          for URL in "${URLS[@]}"; do
            echo "尝试: $URL"
            if curl -fsSL --retry 2 --retry-delay 3 "$URL" -o "$OUTPUT" 2>/dev/null; then
              LINES=$(wc -l < "$OUTPUT")
              if [ "$LINES" -ge 1000 ]; then
                echo "✅ 下载成功: $URL ($LINES 行)"
                break
              else
                echo "❌ 行数太少 ($LINES)，尝试下一个"
              fi
            else
              echo "❌ 下载失败，尝试下一个"
            fi
          done

          LINES=$(wc -l < "$OUTPUT")
          echo "geosite_cn.txt 行数: $LINES"
          echo "geosite_cn.txt 大小: $(du -h "$OUTPUT" | cut -f1)"
          [ "$LINES" -ge 1000 ] || { echo "所有源都失败或行数太少"; exit 1; }

      - name: Verify files
        run: |
          [ -s mobile/internal/data/geoip_cn.txt ] || { echo "geoip_cn.txt 为空"; exit 1; }
          [ -s mobile/internal/data/geosite_cn.txt ] || { echo "geosite_cn.txt 为空"; exit 1; }
          echo "geoip 首行: $(head -1 mobile/internal/data/geoip_cn.txt)"
          echo "geosite 首行: $(head -1 mobile/internal/data/geosite_cn.txt)"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet mobile/internal/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "数据文件无变化"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "数据文件有更新"
            git diff --stat mobile/internal/data/
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y-%m-%d)
          git add mobile/internal/data/
          git commit -m "chore: update geoip/geosite data ($DATE)"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## GeoIP/GeoSite 更新结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 行数 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| geoip_cn.txt | $(wc -l < mobile/internal/data/geoip_cn.txt) | $(du -h mobile/internal/data/geoip_cn.txt | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| geosite_cn.txt | $(wc -l < mobile/internal/data/geosite_cn.txt) | $(du -h mobile/internal/data/geosite_cn.txt | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "变化: ${{ steps.diff.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
