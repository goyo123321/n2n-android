name: Update GeoIP/GeoSite Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Download geo dat files

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create data directory
        run: mkdir -p mobile/internal/data

      - name: Download geoip.dat (renamed to geoip_cn.dat)
        run: |
          URL="https://github.com/v2fly/geoip/releases/latest/download/geoip.dat"
          OUT="mobile/internal/data/geoip_cn.dat"
          echo "下载: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "$OUT"
          SIZE=$(du -h "$OUT" | cut -f1)
          echo "大小: $SIZE"
          [ -s "$OUT" ] || { echo "❌ geoip.dat 为空"; exit 1; }

      - name: Download dlc.dat
        run: |
          URL="https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat"
          OUT="mobile/internal/data/dlc.dat"
          echo "下载: $URL"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "$OUT"
          SIZE=$(du -h "$OUT" | cut -f1)
          echo "大小: $SIZE"
          [ -s "$OUT" ] || { echo "❌ dlc.dat 为空"; exit 1; }

      - name: Verify
        run: |
          ls -la mobile/internal/data/
          echo "--- geoip.dat 头 16 字节 ---"
          xxd mobile/internal/data/geoip_cn.dat | head -1
          echo "--- dlc.dat 头 16 字节 ---"
          xxd mobile/internal/data/dlc.dat | head -1

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet mobile/internal/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add mobile/internal/data/
          git commit -m "chore: update geo dat files ($DATE)"
          git push
