name: Update GeoIP/GeoSite Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Download and compress geo data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create data directory
        run: mkdir -p mobile/internal/data

      - name: Download & gzip geoip
        run: |
          TMP=/tmp/geoip_cn.txt
          OUT=mobile/internal/data/geoip_cn.txt.gz

          URLS=(
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/text/cn.txt"
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt"
          )

          OK=0
          for URL in "${URLS[@]}"; do
            echo "尝试: $URL"
            if curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "$TMP"; then
              LINES=$(wc -l < "$TMP")
              echo "行数: $LINES"
              if [ "$LINES" -ge 1000 ]; then
                OK=1
                break
              fi
            fi
          done

          [ "$OK" -eq 1 ] || { echo "❌ geoip 下载失败"; exit 1; }

          gzip -9 -c "$TMP" > "$OUT"
          echo "原始: $(du -h "$TMP" | cut -f1)"
          echo "压缩: $(du -h "$OUT" | cut -f1)"

      - name: Download & gzip geosite
        run: |
          TMP=/tmp/geosite_cn.txt
          OUT=mobile/internal/data/geosite_cn.txt.gz

          URLS=(
            "https://cdn.jsdelivr.net/gh/v2fly/domain-list-community@master/data/cn"
            "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/cn"
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite-cn.txt"
          )

          OK=0
          for URL in "${URLS[@]}"; do
            echo "尝试: $URL"
            if curl -fsSL --retry 3 --retry-delay 5 "$URL" -o "$TMP"; then
              LINES=$(wc -l < "$TMP")
              echo "行数: $LINES"
              if [ "$LINES" -ge 1000 ]; then
                OK=1
                break
              fi
            fi
          done

          [ "$OK" -eq 1 ] || { echo "❌ geosite 下载失败"; exit 1; }

          gzip -9 -c "$TMP" > "$OUT"
          echo "原始: $(du -h "$TMP" | cut -f1)"
          echo "压缩: $(du -h "$OUT" | cut -f1)"

      - name: Verify
        run: |
          ls -la mobile/internal/data/
          echo "--- geoip 解压后前 3 行 ---"
          zcat mobile/internal/data/geoip_cn.txt.gz | head -3
          echo "--- geosite 解压后前 3 行 ---"
          zcat mobile/internal/data/geosite_cn.txt.gz | head -3

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet mobile/internal/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add mobile/internal/data/
          git commit -m "chore: update geoip/geosite data ($DATE)"
          git push
